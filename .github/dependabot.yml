version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # numpy, pandas and scikit-learn move together; review them as one.
      scientific:
        patterns: ["numpy", "pandas", "pandas-stubs", "scikit-learn", "joblib"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
