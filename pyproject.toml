[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ml-pipeline-toolkit"
dynamic = ["version"]
description = "End-to-end machine learning pipelines: preprocessing, training, evaluation and deployment from one YAML file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas EC. Smith", email = "mail@tecsmith.info" }]
requires-python = ">=3.11"
keywords = ["machine-learning", "mlops", "pipeline", "scikit-learn", "model-serving"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
parquet = ["pyarrow>=15"]

[project.scripts]
mlpipeline = "mlpipeline.cli:main"

[project.urls]
Homepage = "https://www.tecsmith.info/portfolio/repositories/ml-pipeline-toolkit"
Repository = "https://github.com/tec-smith/ml-pipeline-toolkit"
Issues = "https://github.com/tec-smith/ml-pipeline-toolkit/issues"
Changelog = "https://github.com/tec-smith/ml-pipeline-toolkit/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "httpx2>=2.0",
  "mypy>=1.10",
  "pandas-stubs>=2.1",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[tool.hatch.version]
path = "src/mlpipeline/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mlpipeline"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]
# The formatter wraps code; the copyright footers are allowed to run long.
# X and y are the scikit-learn convention for features and target.
ignore = ["E501", "N803", "N806"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
# scikit-learn and joblib ship without type information.
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::FutureWarning"]

[tool.coverage.run]
source = ["mlpipeline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
